# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache breaks with AGP 8.5.2 + compileSdk 35 + MapSourceSetPathsTask
# Disable until AGP upgraded to 8.7+ — fixes "Could not be cached: __librarySourceSets__"
org.gradle.configuration-cache=false

# Suppress AGP warning about compileSdk 35 being newer than tested (8.5.2 tested up to 34)
android.suppressUnsupportedCompileSdk=35

# AndroidX package structure
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compose
kotlin.code.style=official
android.enableJetifier=false

# Lower DEX / resource memory pressure for 2GB-class TV devices
android.enableAppCompileTimeRClass=false
