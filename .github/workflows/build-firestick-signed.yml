name: Build Firestick Signed APK
on:
  push:
    branches: [ "arena/019fbb20-iptv-ultimate" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses
        shell: bash
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        shell: bash
      - name: Generate keystore
        shell: bash
        run: |
          cd android
          if [ ! -f app/dylandos-release.jks ]; then
            keytool -genkeypair -v -keystore app/dylandos-release.jks -alias dylandos -keyalg RSA -keysize 4096 -validity 10000 -storepass dylandos2026 -keypass dylandos2026 -dname "CN=Dylandos IPTV, OU=Mobile, O=Dylandos, L=Unknown, ST=Unknown, C=US"
          fi
          if [ ! -f keystore.properties ]; then
            echo "storeFile=app/dylandos-release.jks" > keystore.properties
            echo "keyAlias=dylandos" >> keystore.properties
            echo "storePassword=dylandos2026" >> keystore.properties
            echo "keyPassword=dylandos2026" >> keystore.properties
          fi
      - name: Build
        shell: bash
        run: |
          cd android
          ./gradlew assembleFirestickRelease --no-configuration-cache --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DylandosIPTV-Firestick-signed
          path: android/app/build/outputs/apk/firestick/release/*.apk