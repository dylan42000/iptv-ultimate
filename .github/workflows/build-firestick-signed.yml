name: Build Firestick Signed APK
on:
  push:
    branches: [ "arena/019fbb20-iptv-ultimate" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Generate keystore
        run: |
          cd android
          if [ ! -f app/dylandos-release.jks ]; then
            keytool -genkeypair -v -keystore app/dylandos-release.jks -alias dylandos -keyalg RSA -keysize 4096 -validity 10000 -storepass dylandos2026 -keypass dylandos2026 -dname "CN=Dylandos IPTV, OU=Mobile, O=Dylandos, L=Unknown, ST=Unknown, C=US"
          fi
          if [ ! -f keystore.properties ]; then
            echo "storeFile=app/dylandos-release.jks" > keystore.properties
            echo "keyAlias=dylandos" >> keystore.properties
            echo "storePassword=dylandos2026" >> keystore.properties
            echo "keyPassword=dylandos2026" >> keystore.properties
          fi
      - name: Build Firestick Release
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleFirestickRelease --no-configuration-cache --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "" >> build.log
          echo "EXIT_CODE=$STATUS" >> build.log
          exit $STATUS

      - name: Find and copy APKs
        if: always()
        run: |
          echo "=== Searching for APKs ==="
          find android -type f -name "*.apk" -exec ls -lh {} \; || echo "No APK found via find"
          echo "=== Listing build outputs ==="
          ls -R android/app/build/outputs/apk/ 2>&1 || echo "No outputs dir"
          mkdir -p android/dist
          find android/app/build/outputs -type f -name "*.apk" -exec cp -v {} android/dist/ \; || true
          ls -lh android/dist/ || true
          DATE=$(date +%Y%m%d)
          for apk in android/dist/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" "android/dist/DylandosIPTV-Firestick-v1.0.0-${DATE}.apk" || true
            fi
          done
          ls -lh android/dist/

      - name: Upload APK if built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DylandosIPTV-Firestick-signed
          path: android/dist/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
